name: GPU Tests

on:
  push:
    branches-ignore: [main]   # correctness on every branch push; main only via merge
  pull_request:
    branches: [main]          # safeguard benchmarks gate the merge
  workflow_dispatch:
    inputs:
      allowed_gpus:
        description: "Comma-separated substrings of acceptable GPU names for release-bench (safety check against another provenance mislabel)"
        required: false
        default: "H100,H200"

jobs:
  # ---------------------------------------------------------------------------
  # Correctness — runs on every branch push and on PRs
  # ---------------------------------------------------------------------------
  correctness:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, gpu]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      # Package already installed by start.sh; pull latest changes for this ref.
      - run: pip install --quiet --no-deps -e .
      - name: Run correctness tests
        run: |
          set -o pipefail
          pytest tests/ \
            -v \
            -m "not perf and not slow" \
            --tb=short \
            --ignore=tests/bench_safeguard.py \
            --ignore=tests/bench_release.py \
            | tee /tmp/pytest-correctness.txt
          # Write pass/fail summary to the Actions job summary page.
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -20 /tmp/pytest-correctness.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Safeguard benchmarks — PR gate only, never on plain branch pushes
  # ---------------------------------------------------------------------------
  safeguard:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, gpu]
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - run: pip install --quiet --no-deps -e .
      - name: Run safeguard benchmarks
        id: bench
        run: |
          set -o pipefail
          pytest tests/bench_safeguard.py \
            -v \
            -m perf \
            --tb=short \
            -s \
            | tee /tmp/pytest-safeguard.txt
      - name: Post speedup table as PR comment
        if: always()   # comment even on failure so regressions are visible
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS="${{ steps.bench.outcome }}"
          ICON=$([ "$STATUS" = "success" ] && echo "✅" || echo "❌")
          BODY=$(printf '%s Safeguard benchmarks — %s\n\n```\n%s\n```' \
            "$ICON" "$STATUS" "$(grep -E 'PASSED|FAILED|speedup|triton=' /tmp/pytest-safeguard.txt || cat /tmp/pytest-safeguard.txt)")
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "$BODY"

  # ---------------------------------------------------------------------------
  # Release-CANDIDATE benchmarks — manual dispatch only. Stages a full sweep
  # into docs/benchmark-history/unreleased.md via a PR for human review; never
  # pushes to main and never touches benchmarks.md. Promoting a staged
  # candidate to benchmarks.md + a version-tagged archive file is a separate,
  # manual step performed when an actual release is cut -- see
  # benchmarks/README.md for the full placement policy.
  # ---------------------------------------------------------------------------
  release-bench:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, gpu]
    permissions:
      contents: write        # needed to push the candidate branch
      pull-requests: write   # needed to open the PR
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - run: pip install --quiet --no-deps -e .
      - name: Assert GPU identity
        run: |
          GPU_NAME=$(python -c "import torch; print(torch.cuda.get_device_name(0))")
          echo "GPU_NAME=$GPU_NAME" >> "$GITHUB_ENV"
          echo "Detected GPU: $GPU_NAME" >> "$GITHUB_STEP_SUMMARY"
          ALLOWED="${{ github.event.inputs.allowed_gpus }}"
          ALLOWED="${ALLOWED:-H100,H200}"
          echo "Allowed substrings: $ALLOWED" >> "$GITHUB_STEP_SUMMARY"
          MATCHED=0
          IFS=',' read -ra SUBSTRINGS <<< "$ALLOWED"
          for s in "${SUBSTRINGS[@]}"; do
            if [[ "$GPU_NAME" == *"$s"* ]]; then
              MATCHED=1
              break
            fi
          done
          if [[ "$MATCHED" -eq 0 ]]; then
            echo "**FAILED: '$GPU_NAME' does not match any allowed substring ($ALLOWED).**" >> "$GITHUB_STEP_SUMMARY"
            echo "GPU identity check failed: '$GPU_NAME' not in allowlist ($ALLOWED)." \
                 "This check exists because this repo's benchmark work has previously" \
                 "been published under the wrong GPU name -- see NOTES.md/bench_safeguard.py." \
                 "If this card is legitimately new, pass allowed_gpus explicitly on dispatch." >&2
            exit 1
          fi
      - name: Run full benchmark sweep
        env:
          PYTHONUNBUFFERED: "1"
          TRITON_CACHE_DIR: /root/.triton/cache
        run: |
          python -u tests/bench_release.py \
            --gpu  "$GPU_NAME" \
            --version unreleased \
            --parent-sweep \
            --skip-readme
      - name: Stage the candidate in docs/benchmark-history/unreleased.md
        run: |
          # bench_release.py only knows how to write "the latest release"
          # (benchmarks.md) and auto-archive whatever it replaces -- it has no
          # stage-only mode (adding one is a Python behavior change that would
          # need its own GPU-verified pass, out of scope for this policy
          # change). So: let it run normally, relocate its output by hand,
          # then restore benchmarks.md and discard any auto-archive side
          # effect, so this job never commits a change to the released
          # benchmarks -- only to the staged candidate.
          cp benchmarks.md /tmp/candidate.md
          git checkout -- benchmarks.md
          git checkout -- docs/benchmark-history/ 2>/dev/null || true
          cp /tmp/candidate.md docs/benchmark-history/unreleased.md
      - name: Open a PR with the staged candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # NOT README.md: --skip-readme leaves it untouched deliberately (README
          # prose is a STOP-and-report item -- a human applies
          # benchmarks/readme_table_draft.md by hand). NOT benchmarks.md: this job
          # never writes a release, only a staged candidate.
          git add docs/benchmark-history/unreleased.md benchmarks/readme_table_draft.md
          git diff --cached --quiet && { echo "No changes to stage -- nothing to PR."; exit 0; }
          BRANCH="bench/unreleased-candidate-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "bench: stage unreleased candidate ($GPU_NAME)"
          git push origin "$BRANCH"
          gh pr create \
            --title "bench: unreleased candidate ($GPU_NAME, $(date -I))" \
            --body "Staged benchmark candidate from a manual release-bench dispatch run. Not a release -- promotion to benchmarks.md + docs/benchmark-history/<version>.md happens separately, by hand, when a version is actually tagged. See benchmarks/README.md for the full placement policy." \
            --base main --head "$BRANCH"
