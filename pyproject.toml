[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-triton"
version = "0.1.3"
description = "High-performance Triton GPU kernels for reinforcement learning"
requires-python = ">=3.10"
keywords = ["reinforcement learning", "triton", "gpu", "cuda", "kernels", "gae", "vtrace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "torch==2.4.1",
    "triton==3.0.0",
]

[project.urls]
Homepage = "https://github.com/simonsays1980/rl-triton"
Repository = "https://github.com/simonsays1980/rl-triton"
Documentation = "https://simonsays1980.github.io/rl-triton"
"Bug Tracker" = "https://github.com/simonsays1980/rl-triton/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-benchmark", "numpy", "matplotlib"]
# DO NOT install alongside [dev] in the same venv: jax[cuda12] requires
# cuDNN >=9.8.0, while [dev]'s pinned torch==2.4.1 hard-requires
# nvidia-cudnn-cu12==9.1.0.70 -- the two cannot coexist (confirmed on a real
# pod: XLA's GPU compiler hard-crashes with a null cuDNN handle). This extra
# exists only as a version reference for the SEPARATE JAX-only venv used by
# benchmark_gae_vs_jax_scan_jax.py -- see that script's and
# benchmark_gae_vs_jax_scan_triton.py's module docstrings, NOTES.md, and
# benchmarks/setup_jax_gae_venvs.sh (which builds both venvs correctly).
jax = ["jax[cuda12]>=0.9.2"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.7",
    "mkdocs-include-markdown-plugin>=7.3",
    "mkdocstrings[python]>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
addopts = "-m 'not slow and not perf'"
markers = [
    "slow: marks tests as slow — full sweep across all configs (deselect with '-m \"not slow\"')",
    "perf: PR safeguard performance tests — one config per algorithm, assert >=1.5x vs pt.compile",
]
