[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-triton"
version = "0.1.0"
description = "High-performance Triton GPU kernels for RL computations"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "triton>=2.3",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-benchmark", "numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
addopts = "-m 'not slow'"
markers = [
    "slow: marks tests as slow — full sweep across all configs (deselect with '-m \"not slow\"')",
    "perf: PR safeguard performance tests — one config per algorithm, assert >=1.5x vs pt.compile",
]
