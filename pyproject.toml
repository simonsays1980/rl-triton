[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-triton"
version = "0.1.3"
description = "High-performance Triton GPU kernels for reinforcement learning"
requires-python = ">=3.10"
keywords = ["reinforcement learning", "triton", "gpu", "cuda", "kernels", "gae", "vtrace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Environment :: GPU :: NVIDIA CUDA",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "torch>=2.4.1",
    "triton>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/simonsays1980/rl-triton"
Repository = "https://github.com/simonsays1980/rl-triton"
Documentation = "https://simonsays1980.github.io/rl-triton"
"Bug Tracker" = "https://github.com/simonsays1980/rl-triton/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-benchmark", "numpy"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.7",
    "mkdocs-include-markdown-plugin>=7.3",
    "mkdocstrings[python]>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
addopts = "-m 'not slow and not perf'"
markers = [
    "slow: marks tests as slow — full sweep across all configs (deselect with '-m \"not slow\"')",
    "perf: PR safeguard performance tests — one config per algorithm, assert >=1.5x vs pt.compile",
]

[tool.ruff]
# Pre-existing debt, fenced off rather than fixed as a side effect of adding
# CI: these 10 codes account for all 50 findings ruff's default rule set
# currently reports across src/ and tests/, none introduced by this change.
# Everything else stays on ruff's default selection, so new code is held to
# the full default standard.
lint.ignore = [
    "C408",    # unnecessary-collection-call
    "DTZ011",  # call-date-today
    "F401",    # unused-import
    "F541",    # f-string-missing-placeholders
    "I001",    # unsorted-imports
    "ISC004",  # implicit-string-concatenation-in-collection-literal
    "PLW1510", # subprocess-run-without-check
    "RUF007",  # zip-instead-of-pairwise
    "RUF059",  # unused-unpacked-variable
    "SIM102",  # collapsible-if
]
